services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    environment:
      PORT: 3000
      # Container port forwarding is non-loopback from the API container's perspective.
      ENDER_API_ACCESS_MODE: open
      ENDER_CORS_ORIGINS: http://localhost:5173
      AGENT_WORKDIR: /app/workspace
      AGENT_WORKSPACE_BASE: /app/workspace
      AGENT_THREADS_DIR: /app/threads
      AGENT_SCHEDULES_DIR: /app/schedules
      AGENT_TASK_LEDGER_DIR: /app/task-ledger
      AGENT_WORKFLOW_SESSIONS_DIR: /app/workflow-sessions
      AGENT_SELF_ROOT: /app
      CODE_SERVER_MODE: docker
      CODE_SERVER_IMAGE: codercom/code-server:latest
      CODE_SERVER_HOST_WORKDIR: ${PWD}/workspace
    ports:
      - "3000:3000"
    volumes:
      - ./threads:/app/threads
      - ./workspace:/app/workspace
      - ./schedules:/app/schedules
      - ./task-ledger:/app/task-ledger
      - ./workflow-sessions:/app/workflow-sessions
      - /var/run/docker.sock:/var/run/docker.sock

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
      args:
        VITE_ENDER_API: http://localhost:3000
    depends_on:
      - api
    ports:
      - "5173:80"
